name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read
  pull-requests: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  package-build:
    name: Package build/typecheck (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['22', '24']

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm ci

      - name: Build package
        run: npm run build --workspace @nest-native/jobs

      - name: Typecheck package
        run: npm run typecheck --workspace @nest-native/jobs

  package-test-node-22:
    name: Package tests/coverage (Node 22)
    runs-on: ubuntu-latest
    # No external DB services: the suite runs SQLite in-memory (better-sqlite3)
    # and Postgres in-process (pglite), so coverage is fully hermetic.
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm run test:cov

  package-quality:
    name: Tests, coverage, and complexity (Node 22)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Restore base branch CI data
        if: github.event_name == 'pull_request'
        id: base-ci-data
        uses: actions/cache/restore@v6
        with:
          path: ci-data
          key: ci-data-node-22-${{ github.base_ref }}-
          restore-keys: ci-data-node-22-${{ github.base_ref }}-

      - name: Extract base CI data
        if: steps.base-ci-data.outputs.cache-matched-key
        run: |
          cp ci-data/coverage-summary.json base-coverage-summary.json 2>/dev/null || true
          cp ci-data/test-results.json base-test-results.json 2>/dev/null || true
          cp ci-data/test-step-duration-ms.txt base-test-step-duration-ms.txt 2>/dev/null || true
          cp ci-data/cognitive-complexity-summary.json base-cognitive-complexity-summary.json 2>/dev/null || true

      - name: Run tests with coverage
        run: |
          START=$SECONDS
          npm run test:cov
          echo $(( (SECONDS - START) * 1000 )) > test-step-duration-ms.txt

      - name: Enforce cognitive complexity threshold
        run: npm run complexity:check

      - name: Generate cognitive complexity report
        run: npm run complexity:report

      - name: Generate base cognitive complexity fallback
        if: github.event_name == 'pull_request'
        run: |
          if [ -f base-cognitive-complexity-summary.json ]; then
            exit 0
          fi

          BASE_DIR="$(mktemp -d)"
          cleanup() {
            git worktree remove --force "$BASE_DIR" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          git worktree add --detach "$BASE_DIR" "${{ github.event.pull_request.base.sha }}"
          ln -s "$GITHUB_WORKSPACE/node_modules" "$BASE_DIR/node_modules"
          # The base tree runs against THIS PR's node_modules, so a PR that
          # changes the complexity tooling itself cannot produce a baseline.
          # That is a missing comparison, not a broken build: the report step
          # already renders fine without a base.
          (
            cd "$BASE_DIR"
            node scripts/collect-cognitive-complexity.mjs \
              --output "$GITHUB_WORKSPACE/base-cognitive-complexity-summary.json"
          ) || {
            echo "::notice::Base complexity report unavailable (tooling changed since the base commit); reporting without a baseline."
            rm -f "$GITHUB_WORKSPACE/base-cognitive-complexity-summary.json"
          }

      - name: Cache CI data for base branch
        if: github.event_name == 'push'
        run: |
          mkdir -p ci-data
          cp coverage/coverage-summary.json ci-data/coverage-summary.json
          cp test-results.json ci-data/test-results.json
          cp test-step-duration-ms.txt ci-data/test-step-duration-ms.txt
          cp complexity/cognitive-complexity-summary.json ci-data/cognitive-complexity-summary.json

      - if: github.event_name == 'push'
        uses: actions/cache/save@v6
        with:
          path: ci-data
          key: ci-data-node-22-${{ github.ref_name }}-${{ github.sha }}

      - name: Get changed files
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin ${{ github.base_ref }} --depth=1
          git diff --name-only origin/${{ github.base_ref }}...HEAD -- 'packages/**/*.ts' | tee changed-files.txt

      - name: Coverage Report
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v9
        with:
          script: |
            const report = require('./.github/scripts/coverage-report.js');
            await report({ github, context, core });

      - name: Performance Report
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v9
        with:
          script: |
            const report = require('./.github/scripts/performance-report.js');
            await report({ github, context, core });

      - name: Complexity Report
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v9
        with:
          script: |
            const report = require('./.github/scripts/complexity-report.js');
            await report({ github, context, core });

      - name: Coverage and performance summary
        run: |
          node -e "
          const fs = require('node:fs');
          const summary = JSON.parse(fs.readFileSync('coverage/coverage-summary.json', 'utf8')).total;
          const duration = fs.readFileSync('test-step-duration-ms.txt', 'utf8').trim();
          const metrics = {
            statements: summary.statements.pct,
            branches: summary.branches.pct,
            functions: summary.functions.pct,
            lines: summary.lines.pct,
          };
          const report = [
            '### Package Quality',
            '',
            '| Metric | Value |',
            '| :--- | ---: |',
            '| Statements | ' + metrics.statements + '% |',
            '| Branches | ' + metrics.branches + '% |',
            '| Functions | ' + metrics.functions + '% |',
            '| Lines | ' + metrics.lines + '% |',
            '| Test step duration | ' + duration + ' ms |',
          ].join('\n');
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, report + '\n');
          "

      - name: Upload quality artifacts
        uses: actions/upload-artifact@v7
        with:
          name: package-quality
          path: |
            coverage/coverage-summary.json
            coverage/lcov.info
            complexity/cognitive-complexity-summary.json
            test-results.json
            test-step-duration-ms.txt
          if-no-files-found: error

  mysql-integration:
    name: MySQL integration (real service)
    runs-on: ubuntu-latest
    # The only job with a DB service: it runs the gated real-MySQL round-trip
    # spec (test/integration), which skips everywhere else because
    # JOBS_MYSQL_URL is unset. The main suite stays hermetic.
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: jobs
          MYSQL_ROOT_PASSWORD: jobs-ci-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pjobs-ci-password"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Run gated MySQL round-trip
        run: npm run test:integration
        env:
          JOBS_MYSQL_URL: mysql://root:jobs-ci-password@127.0.0.1:3306/jobs

  better-sqlite3-latest-major:
    name: better-sqlite3 13 compatibility (Node 22)
    runs-on: ubuntu-latest
    # The published peer range allows better-sqlite3 ^11 || ^12 || ^13 while the
    # devDependency is still on 12.x: 13 requires Node >=22, which kept it out
    # until the Node 20 sunset (#29), and the bump to 13 is a separate dependabot
    # PR (#26). Until that lands, this leg is what makes the v13 end of the range
    # a tested claim rather than an assumption.
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install with better-sqlite3 13
        run: |
          npm install --no-save --workspace-root better-sqlite3@^13.0.0
          node -e "console.log('better-sqlite3', require('better-sqlite3/package.json').version)"

      - name: Run the suite against better-sqlite3 13
        run: npm test

  nestjs-compat:
    name: NestJS ${{ matrix.nest.label }} compatibility (Node 22)
    runs-on: ubuntu-latest
    # The published peer range is @nestjs/common and @nestjs/core ^11 || ^12.
    # The devDependencies and the lockfile every other job installs stay on
    # the 11.x in the middle of that range, so this matrix is what makes its
    # two ENDS tested claims: each leg installs one end on top of the lockfile
    # with --no-save and runs the suite, the package build and the sample
    # matrix against it.
    #
    # Two things keep a leg honest, because npm makes it easy to run a suite
    # against a tree that is not the one you asked for:
    # - --workspaces --include-workspace-root, not --workspace-root: with the
    #   latter npm honours each workspace's own ^11 range by nesting an 11
    #   copy under packages/jobs and sample/00-showcase, so the suite and the
    #   sample silently run against 11 while the root reports the leg's
    #   version.
    # - scripts/check-nestjs-resolution.mjs proves the version from inside
    #   every workspace (exactly, at the floor), fails on nested copies, and
    #   checks every peer range in the NestJS ecosystem against the tree the
    #   suite will run on. That final-tree check is the gate; the install log
    #   is printed for diagnosis only. npm prints `ERESOLVE overriding peer
    #   dependency` and exits 0 both for a real override and for transitional
    #   states that end coherent — replacing @nestjs/* under the nestjs-cls
    #   line, whose peers admit both majors, produces a batch on the 12 leg.
    # The nestjs-cls line is not named here: the lockfile's 6.3.0 /
    # transactional 3.3.0 / adapter 1.5.0 peer `>= 10 < 13`, so they serve
    # both ends unchanged, and the check verifies that.
    # Node is not a dimension here on purpose: 22 floats to a current 22.x,
    # which is what require(esm) on the 12 end needs (>=22.12), and the build
    # job already covers 24.
    strategy:
      fail-fast: false
      matrix:
        nest:
          # 11.0.0 is the oldest graph the published range can produce: this
          # package imports @nestjs/* roots only, and nothing it uses was
          # added by a later 11.x. Pinned exactly so a downgrade that silently
          # no-ops cannot pass as a floor run.
          - { label: '11 floor', spec: '11.0.0' }
          # ^12.0.0 floats, so a new 12.x patch is tested on the next run.
          - { label: '12', spec: '^12.0.0' }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Install NestJS ${{ matrix.nest.label }} (this job only, never saved)
        run: |
          npm install --no-save --workspaces --include-workspace-root \
            "@nestjs/common@${{ matrix.nest.spec }}" \
            "@nestjs/core@${{ matrix.nest.spec }}" \
            "@nestjs/platform-express@${{ matrix.nest.spec }}" \
            "@nestjs/testing@${{ matrix.nest.spec }}"

      - name: Prove every workspace resolves NestJS ${{ matrix.nest.label }}
        run: node scripts/check-nestjs-resolution.mjs "${{ matrix.nest.spec }}"

      - name: Run the suite against NestJS ${{ matrix.nest.label }}
        run: npm test

      - name: Build package against NestJS ${{ matrix.nest.label }}
        run: npm run build --workspace @nest-native/jobs

      - name: Run sample matrix against NestJS ${{ matrix.nest.label }}
        run: npm run ci:sample

  release-and-security:
    name: Release and security checks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Validate package tarball
        run: npm run release:check

      - name: Audit production supply chain
        run: npm run security:audit

  samples:
    name: Sample validation
    runs-on: ubuntu-latest
    # The showcase runs on SQLite in-memory; no external DB services needed.
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Build package
        run: npm run build --workspace @nest-native/jobs

      - name: Run sample matrix
        run: |
          START=$SECONDS
          npm run ci:sample
          echo $(( (SECONDS - START) * 1000 )) > sample-validation-duration-ms.txt

      - name: Sample matrix summary
        run: |
          DURATION_MS="$(cat sample-validation-duration-ms.txt)"
          DURATION_SECONDS="$(node -e "console.log((Number(process.argv[1]) / 1000).toFixed(2))" "$DURATION_MS")"
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ### Sample Matrix

          | Metric | Value |
          | :--- | ---: |
          | Sample validation duration | DURATION_PLACEHOLDER |

          | Driver | Sample | CI behavior |
          | :--- | :--- | :--- |
          | better-sqlite3 | `00-showcase` | In-memory end-to-end smoke |
          EOF
          sed -i "s/DURATION_PLACEHOLDER/${DURATION_SECONDS}s (${DURATION_MS}ms)/" "$GITHUB_STEP_SUMMARY"

  docs-site:
    name: Docusaurus build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install docs website dependencies
        run: npm --prefix website ci

      - name: Build docs site
        run: npm --prefix website run build
